<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Blue Visitor</title></head>
<body>
<script src="story.js"></script>
<script src="fly.js"></script>
<script src="scene.js"></script>
<script>
// A blue butterfly comes out of the dark and settles on her finger. She watches it; then she turns her head and
// looks straight at you. The butterfly leaves. She looks back at her empty hand.
// Way points: [seconds, x, y, size] in picture pixels (1920x1080; the phone's view starts at x = 1012, the picture is
// raised a fifth of the screen and has about 530 pixels of dark above it). The times come from story.js.
(function () {
  const T = Story.T, F = [1163, 407];
  Scene.run({
    // the straight line her far cheek and jaw keep while she is turned, from beside her eye to her chin:
    // two points of her head (picture x, y, depth)
    jaw: [[1390.6, 322.1, -6.2], [1475.7, 440.2, 56.0]],
    landscape: {
      left: 0,
      route: {
        inbound: [[T.enter, 760, 120, 0.16], [2.6, 640, 215, 0.26], [3.9, 500, 330, 0.40], [5.0, 590, 455, 0.55], [6.1, 800, 430, 0.70],
          [7.1, 960, 300, 0.82], [8.0, 1060, 265, 0.92], [8.8, 1120, 330, 0.98], [T.hover, 1140, 375, 1.0], [T.land, F[0], F[1], 1]],
        outbound: [[T.off, F[0], F[1], 1], [T.off + 0.7, 1250, 330, 1.05], [T.off + 1.4, 1400, 270, 1.15], [T.off + 2.1, 1540, 150, 1.25],
          [T.off + 2.9, 1600, 0, 1.3], [T.gone, 1640, -200, 1.35]],
        glides: [[4.25, 4.8], [7.25, 7.7]],
      },
    },
    portrait: {
      left: 1012,
      lift: 0.2,      // raised a fifth of the screen off the bottom; her dress sinks into the dark below
      foot: 230,
      route: {
        inbound: [[T.enter, 1450, -369, 0.16], [2.6, 1300, -272, 0.26], [3.9, 1500, -162, 0.38], [5.0, 1650, -44, 0.5], [6.1, 1480, 60, 0.62],
          [7.1, 1260, 157, 0.75], [8.0, 1150, 240, 0.86], [8.8, 1095, 316, 0.94], [T.hover, 1140, 375, 1.0], [T.land, F[0], F[1], 1]],
        outbound: [[T.off, F[0], F[1], 1], [T.off + 0.7, 1250, 344, 1.05], [T.off + 1.4, 1400, 288, 1.12], [T.off + 2.1, 1530, 178, 1.0],
          [T.off + 2.9, 1500, -23, 0.7], [T.gone, 1380, -245, 0.34]],
        glides: [[4.25, 4.8], [7.25, 7.7]],
        fadeOut: 1.3,
      },
    },
  });
})();
</script>
