<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Surge</title>
</head>
<body>
<script src="common.js"></script>
<script>
// The Surge = Drift + White Fire in one piece (no flash, no shock ring).
// Drift: slow figure-eight parallax behind the boy, rocks bobbing on their own phases, pale dust
// rising behind him, dark ash passing in front, smoke breathing.
// White Fire: a rising noise field sways the aura and smoke tendrils and extra white tongues peel off.
// One 32 s loop: the drift makes 1-3 whole cycles, the fire scrolls whole noise periods.
// The fire sway is held back on the rocks so they float rigidly, and the boy himself never moves.
Scene({
  L: 32,
  frame: (portrait) => portrait ? { cx: 0.5, cy: 0.5, zoom: 1.045 } : { cx: 0.5, cy: 0.455, zoom: 1.045 },
  frag: `
float motes(vec2 q, float scale, float n, float seed, float density, float size){
  float ph = u_t/u_L;
  vec2 g = vec2(q.x*scale, q.y*scale + ph*scale*n);
  vec2 c = floor(g), f = fract(g) - 0.5;
  vec2 cw = vec2(c.x, mod(c.y, scale)) + seed;
  float r = hash(cw);
  if (r > density) return 0.0;
  float r2 = hash(cw + 7.7), r3 = hash(cw + 3.3);
  vec2 o = vec2(r2 - 0.5, r3 - 0.5)*0.5;
  o.x += 0.16*sin(TAU*(2.0*ph + r*9.0));
  float s = size*mix(0.45, 1.0, r3);
  float tw = 0.65 + 0.35*sin(TAU*(3.0*ph + r2*5.0));
  return smoothstep(s, s*0.25, length(f - o)) * tw;
}
vec3 scene(vec2 p){
  vec2 uv = UV(p);
  float ph = u_t/u_L;

  // --- drift: camera parallax + floating rocks -------------------------------------
  vec2 cam = vec2(0.0050*cyc(1.0, 0.0), 0.0036*cyc(2.0, 0.15));
  float depth = texture(u_wide, uv).b;                 // 1 over the whole figure, feathered into the aura
  vec2 buv = uv + cam*(1.0 - depth);
  float dw = texture(u_masks, buv).b * (1.0 - depth);
  float id = buv.x*2.3 + buv.y*1.7;
  vec2 bob = vec2(0.0030*sin(TAU*(2.0*ph + id*1.3)),
                  0.0075*sin(TAU*(1.0*ph + id)) + 0.0025*sin(TAU*(3.0*ph + id*2.1)));
  vec2 suv = buv + (bob - cam*0.55)*dw;

  // --- white fire: rising sway of aura and tendrils ---------------------------------
  vec2 q = vec2(suv.x*ASPECT, suv.y);
  float n1 = pfbm(vec2(q.x*4.0, q.y*3.0 + ph*12.0), vec2(64.0, 12.0));
  float n2 = pfbm(vec2(q.x*9.0 + 3.1, q.y*6.0 + ph*36.0), vec2(64.0, 36.0));
  float n3 = pfbm(vec2(q.x*7.0 + 9.7, q.y*5.0 + ph*20.0), vec2(64.0, 20.0));
  float subj = texture(u_masks, uv).r;
  float nearAura = clamp(texture(u_wide, suv).r, 0.0, 1.0);
  float w = (1.0 - depth) * mix(0.22, 1.0, nearAura) * (1.0 - 0.8*dw);
  vec2 d = vec2((n1-0.5)*0.026 + (n2-0.5)*0.009, (n3-0.5)*0.012) * w;
  d.x /= ASPECT;
  vec2 wuv = suv + d;
  vec3 col = texture(u_img, wuv).rgb;
  col = mix(col, vec3(0.96), texture(u_masks, wuv).r * (1.0 - subj));   // never drag his ink into the fire
  col = mix(col, texture(u_img, uv).rgb, subj);                          // the figure is untouched

  float aura = texture(u_soft, wuv).g;
  // smoke breathing in the grey background
  float sm = pfbm(vec2(q.x*2.4, q.y*2.0 + ph*2.0), vec2(64.0, 2.0));
  float sm2 = pfbm(vec2(q.x*4.0 + 4.0, q.y*3.0 + ph*3.0), vec2(64.0, 3.0));
  col *= 1.0 + ((sm - 0.5)*0.22 + (sm2 - 0.5)*0.08) * (1.0 - subj) * (1.0 - aura);

  // extra tongues peeling off the aura
  vec2 fq = vec2(q.x*6.0 + (n1-0.5)*2.2, q.y*2.6 + ph*24.0);
  float f = pfbm(fq, vec2(64.0, 24.0));
  float g = pfbm(fq*vec2(2.0,1.5) + 5.0, vec2(128.0, 36.0));
  float reach = nearAura * (1.0 - subj);
  float tongue = smoothstep(0.60, 0.70, f*0.7 + g*0.3 + reach*0.22) * reach;
  col = mix(col, vec3(0.97), tongue*0.8);
  col += reach * 0.03 * cyc(4.0, 0.0);

  // dust behind him, ash in front
  vec2 mq = vec2(uv.x*ASPECT, uv.y);
  float far  = motes(mq + cam*2.0, 26.0, 1.0, 1.0, 0.30, 0.10);
  float near = motes(mq + cam*6.0, 11.0, 2.0, 5.0, 0.22, 0.09);
  col = mix(col, vec3(0.95), (far*0.55 + near*0.40) * (1.0 - subj) * (1.0 - aura*0.8));
  float ash = motes(mq - cam*8.0 + 0.37, 7.0, 3.0, 9.0, 0.18, 0.055);
  ash *= 1.0 - clamp(texture(u_soft, uv).r*2.5, 0.0, 1.0);               // never over the eyes
  col = mix(col, vec3(0.06), ash*0.75);
  return col;
}`
});
</script>
</body>
</html>
