<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embers</title></head><body>
<script src="lib.js"></script>
<script>
// Embers: the picture stays still; warm sparks lift off the leaf litter and rise through the
// trees, with a few slow blinking motes hanging in the air. Additive point sprites, positions are
// pure functions of loop time (each spark lives a whole number of lives per loop and fades at both
// ends, so the wrap is invisible). Far sparks pass behind the trunks via the occluder mask.
Concept({
  L: 32,
  landscape: { focus: [0.5, 0.5] },
  portrait:  { focus: [0.47, 0.5] },   // slice nudged left: path, glow and the big left trunk
  frag: `
vec3 scene(vec2 uv) {
  vec3 c = pic(uv), m = msk(uv);
  // the litter glows a touch warmer and cooler, like a bed of coals
  float h = max(uv.y - HORIZON, 0.);
  float w = .5 + .5 * sin(ph(2.) + uv.x * 5.) * sin(ph(1.) + 1.3);
  c *= 1. + .07 * w * m.r * smoothstep(0., .1, h);
  return c;
}`,
  points: {
    count: 230, seed: 2190,
    vert: `
varying float v_a, v_far, v_mote, v_px;
void main() {
  float T = u_t / u_L;
  float mote = step(.84, a_seed.w);
  float depth = a_seed.z;                     // 0 far .. 1 near
  float id = a_seed.x * 91. + a_seed.y * 57.;
  vec2 p; float a, size;
  float spread = mix(1., .5, u_port);         // portrait: keep them inside the slice
  if (mote < .5) {
    float lives = 1. + floor(a_seed.w / .84 * 2.99);          // 1..3 lives per loop
    float f = fract(lives * T + a_seed.y);
    float cx = a_seed.x - .5;
    float h0 = mix(.012, .30, depth * depth);
    p.x = VP.x + cx * (.25 + abs(cx) * 1.5) * spread * (.5 + depth);
    p.y = HORIZON + h0 - f * mix(.22, .62, depth) * (.6 + .4 * hash1(id));
    p.x += (.012 + .03 * depth) * (sin(TAU * (f * 1.5 + a_seed.y)) * .6 + f * (hash1(id + 3.) - .4) * 2.);
    a = smoothstep(0., .07, f) * (1. - smoothstep(.45, 1., f));
    a *= .65 + .35 * sin(ph(7. + floor(hash1(id + 5.) * 9.)) + id);
    size = mix(.006, .022, depth * depth);
  } else {
    vec2 c0 = vec2(VP.x + (a_seed.x - .5) * 1.1 * spread, mix(.30, .86, a_seed.y));
    float k1 = 1. + floor(hash1(id) * 2.), k2 = 1. + floor(hash1(id + 1.) * 3.);
    p = c0 + vec2(sin(ph(k1) + id) / ASPECT, cos(ph(k2) + id * 1.7) * .6) * .035;
    a = pow(max(0., sin(ph(2. + floor(hash1(id + 2.) * 3.)) + id * 3.)), 3.) * .8;
    size = mix(.009, .02, depth);
  }
  vec2 s = (u_i2s * vec3(p, 1.)).xy;
  gl_Position = vec4(s.x * 2. - 1., 1. - s.y * 2., 0., 1.);
  v_px = max(size * u_pxh, 3.);
  gl_PointSize = v_px;
  v_a = a * min(1., size * u_pxh / 3.);
  v_far = 1. - smoothstep(.45, .7, depth);
  v_mote = mote;
}`,
    frag: `
varying float v_a, v_far, v_mote, v_px;
void main() {
  float d = length(gl_PointCoord - .5) * 2.;
  float core = exp(-d * d * 22.), halo = exp(-d * d * 3.2) * (1. - d);
  vec2 s = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y) / u_res;
  float occ = msk((u_s2i * vec3(s, 1.)).xy).g;
  float a = v_a * (1. - v_far * smoothstep(.35, .8, occ));
  vec3 hot = mix(vec3(1., .62, .22), vec3(1., .80, .50), v_mote);
  vec3 warm = mix(vec3(.95, .16, .04), vec3(.9, .28, .10), v_mote);
  gl_FragColor = vec4((hot * core * 1.25 + warm * max(halo, 0.) * .7) * a, 1.);
}`
  }
});
</script></body></html>
